<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will you be my Valentine? 💘</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-hearts"></div>

  <main class="card">
    <h1>Will you be my Valentine? 💘</h1>

    <div class="photo">
      <!-- Put your image in /assets and update the filename -->
      <img src="assets/Cuties.JPG" alt="Us" />
    </div>

    <p class="sub">I made you a whole website… so like you kinda have to say yes 😌</p>

    <div class="buttons">
      <button id="yesBtn">Yes 💞</button>
      <button id="noBtn">No 🙃</button>
    </div>

    <div class="music">
      <p>Song:</p>
      <!-- Autoplay usually gets blocked; this gives a play button (safe/reliable) -->
      <audio controls>
        <source src="assets/Ariel.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
    </div>

    <p id="message" class="message"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>

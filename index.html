<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will you be my Valentine? 💘</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-hearts"></div>

  <main class="card">
    <h1>Will you be my Valentine? 💘</h1>

    <div class="photo">
      <div class="photo-frame">
        <img src="assets/Cuties.JPG" alt="Us" />
      </div>
      <p class="caption">we really need to take more photos lol i couldnt find any</p>
    </div>
    
    

    <p class="sub">I made you a whole website… so like you kinda have to say yes 😌</p>

    <div class="buttons">
      <button id="yesBtn">Yes 💞</button>
      <button id="noBtn">No 🙃</button>
    </div>

 

    <p id="message" class="message"></p>
    <audio id="bgMusic" loop>
      <source src="assets/Ariel.mp3" type="audio/mpeg" />
    </audio>
    
  </main>

  <script src="script.js"></script>
</body>
</html>
